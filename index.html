function maybePromptSleep(){
  if(routeParts().length) return;
  if(sheet.hasAttribute('open')||dlg.hasAttribute('open')) return;
  if(new Date().getHours()<5) return;                 // too early: last night isn't over yet
  const tk=key(today());
  if(sleepEntry(tk)||LS.get(K_SNOOZE,'')===tk) return;
  openSleep(tk,true);
}
async function afterLaunch(){
  if(configured()) await sync();                       // pick up a log made on your other device first
  maybePromptSleep();
}

sheet.addEventListener('change',e=>{
  if(e.target.id==='s-date'){ sh.due=e.target.value||''; refreshChips(); }
  else if(e.target.id==='s-time'){ sh.time=e.target.value||sh.time; }
});
sheet.addEventListener('input',e=>{
  if(e.target.id==='s-cat') syncCatChips();
  else if(e.target.id==='pk-q'){ sh.pq=e.target.value; refreshPickerList(); }
  else if(e.target.id==='s-title' && sh && sh.kind==='routines'){ sh.title=e.target.value; }
});
sheet.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='s-title'){ e.preventDefault(); saveSheet(); }
  else if(e.key==='Enter' && e.target.id==='ex-name'){ e.preventDefault(); $('#ex-add')?.click(); }
});

/* ---------- page events ---------- */
const dateKeyOf = t => t.dataset.scope==='s'?'sdate':'date';
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  switch(t.dataset.act){
    case 'settings': openSettings(); break;
    case 'tab': ui.tab=t.dataset.tab; ui.edit=false; saveUI(); render(); break;
    case 's-tab': ui.stab=t.dataset.tab; saveUI(); render(); break;
    case 'range': ui.range=t.dataset.r; saveUI(); render(); break;
    case 's-range': ui.srange=t.dataset.r; saveUI(); render(); break;
    case 'day': ui[dateKeyOf(t)]=t.dataset.date; render(); break;
    case 'today': ui[dateKeyOf(t)]=key(today()); render(); break;
    case 'week': { const k=dateKeyOf(t); let d=addDays(parse(ui[k]),7*Number(t.dataset.dir)); const T=today(); if(d>T) d=T; ui[k]=key(d); render(); break; }
    case 'h-toggle': toggleHabit(t.dataset.id,t.dataset.date||ui.date); break;
    case 'hb-new': openHabitSheet(); break;
    case 'hb-edit': openHabitSheet(t.dataset.id); break;
    case 'edit-mode': ui.edit=!ui.edit; render(); break;
    case 's-open': openSleep(t.dataset.date); break;
    case 'info': {
      const tg=t.dataset.t;
      document.querySelectorAll(`[data-t="${tg}"].sel`).forEach(c=>c.classList.remove('sel'));
      t.classList.add('sel');
      const out=document.getElementById(tg); if(out) out.textContent=t.dataset.info;
      break;
    }
    case 'w-tab': ui.wtab=t.dataset.tab; saveUI(); render(); break;
    case 'w-range': ui.wrange=t.dataset.r; saveUI(); render(); break;
    case 'r-start': startWorkout(t.dataset.id); break;
    case 'r-new': openRoutineSheet(); break;
    case 'r-edit': openRoutineSheet(t.dataset.id); break;
    case 'w-empty': startWorkout(null); break;
    case 'w-open': location.hash='#/workouts/live/'+t.dataset.id; break;
    case 'ex-open': location.hash='#/workouts/exercise/'+t.dataset.id; break;
    case 'w-addex': openWorkoutPicker(t.dataset.id); break;
    case 'w-finish': finishWorkout(routeParts()[2]); break;
    case 'w-del': {
      if(!t.dataset.confirm){ t.dataset.confirm='1'; t.textContent='Tap again to delete'; break; }
      deleteWorkout(routeParts()[2]); break;
    }
    case 'ex-rm': removeExerciseFromWorkout(routeParts()[2],Number(t.dataset.i)); break;
    case 'set-add': {
      const wid=routeParts()[2], idx=Number(t.dataset.exidx);
      const blk=t.closest('.exblock');
      const wRaw=blk.querySelector('.pend-w').value, rRaw=blk.querySelector('.pend-r').value;
      const r=Math.round(parseAmount(rRaw));
      if(!r||r<=0){ blk.querySelector('.pend-r').focus(); break; }
      const w=parseAmount(wRaw); addSet(wid,idx,isFinite(w)?w:0,r); break;
    }
    case 'set-rm': removeSet(routeParts()[2],Number(t.dataset.exidx),Number(t.dataset.setidx)); break;
    case 'sup-new': openSupplementSheet(); break;
    case 'sup-edit': openSupplementSheet(t.dataset.id); break;
    case 'sup-editmode': ui.supEdit=!ui.supEdit; render(); break;
    case 't-new': openSheet('todos'); break;
    case 't-edit': openSheet('todos',t.dataset.id); break;
    case 't-toggle': toggleItem('todos',t.dataset.id); break;
    case 't-clear': clearDone(); break;
    case 'g-new': openSheet('goals',null,t.dataset.cat); break;
    case 'g-edit': openSheet('goals',t.dataset.id); break;
    case 'g-toggle': toggleItem('goals',t.dataset.id); break;
  }
});
/* editing an already-logged set commits on blur/enter, without a full re-render, so focus is never lost */
$('#view').addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-set-field]')) updateSetField(routeParts()[2],Number(t.dataset.exidx),Number(t.dataset.setidx),t.dataset.setField,t.value);
});
$('#view').addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.matches('[data-set-field],.pend-w,.pend-r')){ e.preventDefault(); e.target.blur(); }
});

/* ---------- GitHub sync ---------- */
const b64e = s => { let bin=''; new TextEncoder().encode(s).forEach(c=>bin+=String.fromCharCode(c)); return btoa(bin); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
class HttpErr extends Error{ constructor(status,msg){ super(msg); this.status=status; } }

const configured = () => !!(cfg && cfg.repo && cfg.token);
const apiUrl = () => `https://api.github.com/repos/${cfg.repo}/contents/${encodeURI(cfg.path||'data.json')}`;
const headers = () => ({ Authorization:`Bearer ${cfg.token}`, Accept:'application/vnd.github+json' });

async function ghGet(){
  const r=await fetch(`${apiUrl()}?ref=${encodeURIComponent(cfg.branch||'main')}`,{headers:headers(),cache:'no-store'});
  if(r.status===404) return {sha:null,data:null};
  if(!r.ok) throw new HttpErr(r.status,'GitHub error '+r.status);
  const j=await r.json();
  let data=null; try{ data=JSON.parse(b64d(j.content||'')); }catch{}
  return {sha:j.sha,data};
}
async function ghPut(s,sha){
  const body={message:'Update portal data',content:b64e(serialize(s)),branch:cfg.branch||'main'};
  if(sha) body.sha=sha;
  const r=await fetch(apiUrl(),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new HttpErr(r.status,'GitHub error '+r.status);
}
function explain(e){
  if(e.status===401) return 'GitHub rejected the token.';
  if(e.status===403) return 'The token needs Contents: read and write access to this repository.';
  if(e.status===404) return 'Repository or branch not found, or the token cannot see it.';
  if(e.status===422) return 'GitHub could not save the file. Check the branch name.';
  if(!navigator.onLine || e instanceof TypeError) return 'You appear to be offline.';
  return e.message || 'Sync failed.';
}
let status={s:'local',m:''};
function setStatus(s,m){ status={s,m:m||''}; applyStatus(); }
function applyStatus(){
  const b=$('#sync'); if(!b) return;
  b.dataset.s=status.s; b.title=status.m;
  $('#syncTxt').textContent={local:'Local only',busy:'Syncing',ok:'Synced',err:'Sync issue'}[status.s];
}

let syncing=false, queued=false, timer=null;
async function sync(){
  if(!configured()){ setStatus('local'); return {ok:true}; }
  if(syncing){ queued=true; return {ok:true}; }
  syncing=true; setStatus('busy');
  let result={ok:true};
  try{
    for(let i=0;i<3;i++){
      const {sha,data}=await ghGet();
      const remote=normalize(data);
      const merged=merge(store,remote);
      const needPush = !data || sig(merged)!==sig(remote);
      if(sig(merged)!==sig(store)){ store=merged; save(); render(); }
      if(!needPush) break;
      try{ await ghPut(merged,sha); break; }
      catch(e){ if((e.status===409||e.status===422) && i<2) continue; throw e; }
    }
    setStatus('ok');
  }catch(e){
    result={ok:false,error:explain(e)}; setStatus('err',result.error);
  }finally{
    syncing=false;
    if(queued){ queued=false; setTimeout(sync,0); }
  }
  return result;
}
function queuePush(){
  if(!configured()) return;
  setStatus('busy'); clearTimeout(timer); timer=setTimeout(sync,1200);
}

/* ---------- settings sheet ---------- */
const dlg=$('#dlg'), msg=t=>{ $('#msg').textContent=t; };
function openSettings(){
  $('#f-repo').value=cfg?.repo||''; $('#f-token').value=cfg?.token||'';
  $('#f-branch').value=cfg?.branch||''; $('#f-path').value=cfg?.path||'';
  msg(status.s==='err'?status.m:'');
  dlg.showModal();
}
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
$('#btn-close').addEventListener('click',()=>dlg.close());
$('#btn-save').addEventListener('click',async()=>{
  const repo=$('#f-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return msg('Enter the repository as username/name.');
  const token=$('#f-token').value.trim();
  if(!token) return msg('Add an access token.');
  cfg={repo,token,branch:$('#f-branch').value.trim()||'main',path:$('#f-path').value.trim()||'data.json'};
  LS.set(K_CFG,cfg);
  msg('Connecting...');
  const r=await sync();
  msg(r.ok?'Connected. Your data is synced.':r.error);
});
$('#btn-disc').addEventListener('click',()=>{
  LS.del(K_CFG); cfg=null; setStatus('local');
  ['#f-repo','#f-token','#f-branch','#f-path'].forEach(s=>$(s).value='');
  msg('Disconnected. Your data stays on this device.');
});
$('#btn-export').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([serialize(store)],{type:'application/json'}));
  a.download=`portal-${key(today())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$('#f-import').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const inc=normalize(JSON.parse(await f.text()));
    store=merge(store,inc); ensureSeeds(); save(); render(); queuePush();
    msg(`Imported ${Object.keys(inc.log).length} habit entries, ${Object.keys(inc.sleep).length} sleep entries, ${Object.keys(inc.workouts).length} workouts, ${Object.keys(inc.supplements).length} supplements, ${Object.keys(inc.goals).length} goals, ${Object.keys(inc.todos).length} tasks.`);
  }catch{ msg('That file could not be read.'); }
  e.target.value='';
});

/* ---------- boot ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const T=today();
    if(parse(ui.date)>T) ui.date=key(T);
    if(parse(ui.sdate)>T) ui.sdate=key(T);
    render(); afterLaunch();
  }
});
window.addEventListener('online',()=>{ if(configured()) sync(); });

save();
paintTabIcons();
setStatus(configured()?'busy':'local');
render();
afterLaunch();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
